name: Accessibility check

# Runs on every pull request to main: builds the site and scans every page
# with axe-core (WCAG 2.0/2.1 A and AA rules) at desktop and phone widths.
# A violation fails the check. See CLAUDE.md for the accessibility rules.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Uses the Google Chrome already on GitHub's runner image instead of
      # downloading Playwright's Chromium, whose system packages come from Ubuntu's
      # package mirrors -- when those are unreachable the check hung for 20 minutes.
      - name: Install accessibility tools
        run: npm install --no-save playwright@1.47.2 @axe-core/playwright@4.10.0

      - name: Scan every page
        env:
          A11Y_BROWSER_CHANNEL: chrome
        run: node scripts/a11y-check.mjs
